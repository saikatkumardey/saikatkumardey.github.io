{{ define "main" }}
<article>
  <div style="margin-bottom: 1.5rem;">
    <time datetime='{{ .Date.Format "2006-01-02" }}' style="font-size: 0.82rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">
      {{ .Date.Format "January 2, 2006" }}
    </time>
  </div>
  <div style="line-height: 1.8; font-size: 1rem;">
    {{ .Content }}
  </div>
</article>
<p style="margin-top: 2rem;">
  <small>
    <a href="{{ "thoughts" | relURL }}">&larr; Back to thoughts</a>
  </small>
</p>
{{ end }}
