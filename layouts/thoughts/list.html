{{ define "main" }}
<h1>{{ .Title }}</h1>
<p><i>{{ .Content }}</i></p>
<div class="thoughts-entries">
  {{ range (.Pages.GroupByDate "January 2, 2006" "desc") }}
  <div style="margin-bottom: 2.5rem;">
    <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.75rem;">
      {{ .Key }}
    </div>
    {{ range .Pages }}
    <article style="margin-bottom: 1rem; padding: 0.9rem 1.1rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; line-height: 1.75;">
      {{ .Content }}
    </article>
    {{ end }}
  </div>
  {{ else }}
  <p>No thoughts yet.</p>
  {{ end }}
</div>
{{ end }}
