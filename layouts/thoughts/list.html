{{ define "main" }}
<h1>{{ .Title }}</h1>
<p><i>{{ .Content }}</i></p>
<div class="thoughts-entries">
  {{ range (.Pages.GroupByDate "January 2, 2006" "desc") }}
  <div style="margin-bottom: 2.5rem;">
    <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.75rem;">
      {{ .Key }}
    </div>
    {{ range $i, $p := .Pages }}
    {{ if gt $i 0 }}<hr style="margin: 1.25rem 0; border: none; border-top: 1px solid var(--border);">{{ end }}
    <article style="font-size: 0.95rem; line-height: 1.75;">
      {{ $p.Content }}
    </article>
    {{ end }}
  </div>
  {{ else }}
  <p>No thoughts yet.</p>
  {{ end }}
</div>
{{ end }}
