{{ define "main" }}
<h1>{{ .Title }}</h1>
<p><i>{{ .Content }}</i></p>
<div class="til-entries">
  {{ range (.Pages.ByDate.Reverse) }}
  <article class="til-entry" style="margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);">
    <h3 style="margin: 0.5rem 0;">
      <a href="{{ .Permalink }}" style="text-decoration: none;">
        <time datetime='{{ .Date.Format "2006-01-02" }}' style="color: var(--text-secondary);">
          {{ .Date.Format "2006-01-02" }}
        </time>
      </a>
    </h3>
    <div style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">
      {{ .Summary }}
    </div>
  </article>
  {{ else }}
  <p>No TIL entries yet.</p>
  {{ end }}
</div>
{{ end }}
