<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --fg: #111; --muted: #888; --line: #eee; --bg: #fff; --accent: #0645ad;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* top bar fades out while typing */
  #bar {
    position: fixed; inset: 0 0 auto 0; height: 52px; display: flex; align-items: center;
    gap: 18px; padding: 0 20px; font-size: 14px; color: var(--muted);
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px); z-index: 5;
    transition: opacity .4s ease;
  }
  body.typing #bar { opacity: 0; }
  #bar:hover { opacity: 1 !important; }
  #bar .spacer { flex: 1; }
  #bar button:hover { color: var(--fg); }
  #publish {
    color: #fff !important; background: var(--fg); padding: 7px 14px; border-radius: 7px; font-weight: 600;
  }
  #publish:disabled { opacity: .4; cursor: default; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .pill.live { border-color: #b7e4c7; color: #2d6a4f; }

  main { max-width: 720px; margin: 0 auto; padding: 110px 24px 40vh; }
  #title {
    width: 100%; border: 0; outline: 0; font: 700 38px/1.2 var(--font); color: #000;
    padding: 0; margin: 0 0 6px; background: none;
  }
  #title::placeholder, #body::placeholder { color: #c4c4c4; }
  #meta { display: flex; gap: 14px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  #date { border: 0; font: inherit; color: inherit; background: none; outline: 0; padding: 0; }
  #body {
    width: 100%; border: 0; outline: 0; resize: none; overflow: hidden; background: none;
    font: 18px/1.7 var(--font); color: var(--fg); padding: 0; min-height: 50vh;
    caret-color: var(--accent);
  }

  /* preview mirrors the live site */
  #preview { display: none; font-size: 18px; line-height: 1.7; }
  body.previewing #body { display: none; }
  body.previewing #preview { display: block; }
  #preview h1, #preview h2, #preview h3 { color: #000; line-height: 1.3; }
  #preview a { color: var(--accent); }
  #preview img { max-width: 100%; }
  #preview code { font-family: var(--mono); font-size: .9em; background: #f2f2f2; padding: 2px 5px; }
  #preview pre code { display: block; padding: 20px; white-space: pre-wrap; font-size: 14px; }
  #preview blockquote { border-left: 3px solid #ccc; margin-left: 0; padding-left: 20px; font-style: italic; }

  /* palette + modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.18); display: none;
    align-items: flex-start; justify-content: center; padding-top: 14vh; z-index: 10;
  }
  .overlay.open { display: flex; animation: fade .12s ease; }
  @keyframes fade { from { opacity: 0 } }
  .card {
    width: min(560px, 92vw); background: #fff; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
  }
  #q { width: 100%; border: 0; outline: 0; font: 18px var(--font); padding: 18px 20px; border-bottom: 1px solid var(--line); }
  #list { max-height: 50vh; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
  #list li { padding: 10px 14px; border-radius: 8px; display: flex; gap: 12px; cursor: pointer; align-items: baseline; }
  #list li.sel { background: #f3f3f3; }
  #list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .d { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .modal-body { padding: 22px 22px 18px; }
  .modal-body h3 { margin: 0 0 8px; font-size: 18px; }
  .modal-body p { margin: 0 0 18px; color: #555; font-size: 15px; }
  .modal-body pre { font: 12px/1.5 var(--mono); background: #f6f6f6; padding: 12px; max-height: 30vh; overflow: auto; white-space: pre-wrap; }
  .actions { display: flex; justify-content: flex-end; gap: 16px; align-items: center; font-size: 15px; }
  .actions .primary { background: var(--fg); color: #fff; padding: 8px 16px; border-radius: 7px; font-weight: 600; }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
    background: var(--fg); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
    transition: all .25s ease; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="bar">
  <button id="open" title="All posts (⌘O)">Posts</button>
  <button id="new" title="New post (⌘N)">New</button>
  <span class="spacer"></span>
  <span id="status">…</span>
  <button id="toggle" title="Preview (⌘/)">Preview</button>
  <button id="publish" title="Publish (⌘⏎)">Publish</button>
</div>

<main>
  <input id="title" placeholder="Title" autocomplete="off" spellcheck="true">
  <div id="meta">
    <input id="date" type="date">
    <span id="state" class="pill">Draft</span>
    <span id="hidden" class="pill" style="display:none" title="Not listed on the blog">Unlisted</span>
  </div>
  <textarea id="body" placeholder="Write…" spellcheck="true"></textarea>
  <article id="preview"></article>
</main>

<div class="overlay" id="palette">
  <div class="card">
    <input id="q" placeholder="Find a post…" autocomplete="off">
    <ul id="list"></ul>
  </div>
</div>

<div class="overlay" id="modal">
  <div class="card"><div class="modal-body" id="modalBody"></div></div>
</div>

<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const els = { title: $("title"), body: $("body"), date: $("date"), state: $("state"),
  hidden: $("hidden"), status: $("status"), preview: $("preview"), publish: $("publish") };

let post = null;          // { file, title, date, draft, hidden, body }
let saving = false, pending = false, timer = null, typingTimer = null;
let lastSaved = "";

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

async function api(route, data = {}) {
  const r = await fetch(route, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok && !("ok" in j)) throw new Error(j.error || r.statusText);
  return j;
}

function today() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
function words(s) { return (s.match(/\S+/g) || []).length; }
function snapshot() { return JSON.stringify([els.title.value, els.date.value, els.body.value]); }

function toast(msg, ms = 2200) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

function grow() { els.body.style.height = "auto"; els.body.style.height = els.body.scrollHeight + "px"; }

function setStatus(text) {
  const w = words(els.body.value);
  const mins = Math.max(1, Math.round(w / 230));
  els.status.textContent = `${text} · ${w} words · ${mins} min`;
}

function render() {
  els.state.textContent = post.draft ? "Draft" : "Published";
  els.state.classList.toggle("live", !post.draft);
  els.hidden.style.display = post.hidden ? "" : "none";
  els.publish.textContent = post.draft ? "Publish" : "Update";
}

function load(p) {
  post = p;
  els.title.value = p.title || "";
  els.date.value = p.date || today();
  els.body.value = p.body || "";
  lastSaved = snapshot();
  if (p.file) store.set("lastFile", p.file); else store.del("lastFile");
  render(); grow(); setStatus(p.file ? "Saved" : "New");
  document.body.classList.remove("previewing");
  $("toggle").textContent = "Preview";
  (els.title.value ? els.body : els.title).focus();
}

function newPost() {
  const d = JSON.parse(store.get("newDraft") || "null");
  load({ file: null, title: d?.title || "", date: today(), draft: true, hidden: false, body: d?.body || "" });
}

async function openFile(file) {
  try { load(await api("/api/open", { file })); }
  catch (e) { toast(e.message); newPost(); }
}

// ---------- autosave ----------
function changed() {
  setStatus("Editing");
  clearTimeout(timer); timer = setTimeout(save, 700);
  document.body.classList.add("typing");
  clearTimeout(typingTimer); typingTimer = setTimeout(() => document.body.classList.remove("typing"), 1500);
}

async function save() {
  clearTimeout(timer);
  if (snapshot() === lastSaved) { setStatus("Saved"); return true; }
  if (!post.file && !els.title.value.trim()) {
    store.set("newDraft", JSON.stringify({ title: els.title.value, body: els.body.value }));
    setStatus("Add a title to save");
    return false;
  }
  if (saving) { pending = true; return false; }
  saving = true;
  const snap = snapshot();
  try {
    const r = await api("/api/save", { file: post.file, title: els.title.value, date: els.date.value, draft: post.draft, body: els.body.value });
    if (!post.file) store.del("newDraft");
    post.file = r.file; store.set("lastFile", r.file);
    lastSaved = snap;
    setStatus(snapshot() === lastSaved ? "Saved" : "Editing");
  } catch (e) { setStatus("Not saved"); toast("Save failed: " + e.message, 4000); }
  saving = false;
  if (pending) { pending = false; save(); }
  return true;
}

// ---------- publish ----------
function confirmPublish() {
  if (!els.title.value.trim()) { toast("Add a title first"); els.title.focus(); return; }
  modal(`
    <h3>${post.draft ? "Publish" : "Update"} “${esc(els.title.value)}”?</h3>
    <p>This commits the post and pushes it to GitHub. The site redeploys in about 1 minute.</p>
    <div class="actions"><button data-act="cancel">Cancel <kbd>esc</kbd></button>
    <button class="primary" data-act="go">${post.draft ? "Publish" : "Update"} <kbd style="color:#ccc;border-color:#555">⏎</kbd></button></div>`,
    { go: doPublish });
}

async function doPublish() {
  closeModal();
  await save();
  els.publish.disabled = true; setStatus("Publishing…");
  try {
    const r = await api("/api/publish", { file: post.file, title: els.title.value, date: els.date.value, body: els.body.value });
    if (r.ok) {
      post.draft = false; post.file = r.file; lastSaved = snapshot(); render();
      setStatus("Published"); toast(r.log);
    } else {
      setStatus("Publish failed");
      modal(`<h3>Publish failed</h3><p>Your text is saved on disk. Git said:</p><pre>${esc(r.log)}</pre>
        <div class="actions"><button class="primary" data-act="cancel">OK</button></div>`);
    }
  } catch (e) { setStatus("Publish failed"); toast(e.message, 4000); }
  els.publish.disabled = false;
}

// ---------- preview ----------
function togglePreview() {
  const on = !document.body.classList.contains("previewing");
  if (on) {
    els.preview.innerHTML = window.marked ? marked.parse(els.body.value) : `<pre>${esc(els.body.value)}</pre>`;
  }
  document.body.classList.toggle("previewing", on);
  $("toggle").textContent = on ? "Edit" : "Preview";
  if (!on) els.body.focus();
}

// ---------- palette ----------
let items = [], sel = 0;
async function openPalette() {
  $("palette").classList.add("open"); $("q").value = ""; $("q").focus();
  try {
    const r = await api("/api/posts");
    items = [{ new: true, title: "New post", date: "⌘N" }, ...r.posts];
    if (r.branch && r.branch !== "main") toast(`On branch "${r.branch}", not main`, 4000);
  } catch (e) { items = [{ new: true, title: "New post", date: "" }]; toast(e.message); }
  sel = 0; drawList();
}
function filtered() {
  const q = $("q").value.toLowerCase().trim();
  return q ? items.filter(i => i.title.toLowerCase().includes(q)) : items;
}
function drawList() {
  const list = filtered(); sel = Math.min(sel, Math.max(0, list.length - 1));
  $("list").innerHTML = list.map((p, i) => `<li class="${i === sel ? "sel" : ""}" data-i="${i}">
    <span class="t">${esc(p.title)}</span>
    <span class="d">${p.new ? p.date : (p.draft ? "draft · " : p.hidden ? "unlisted · " : "") + p.date}</span></li>`).join("");
  $("list").querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}
async function choose(i) {
  const p = filtered()[i]; if (!p) return;
  closePalette(); await save();
  p.new ? newPost() : openFile(p.file);
}
function closePalette() { $("palette").classList.remove("open"); }

$("q").addEventListener("input", () => { sel = 0; drawList(); });
$("list").addEventListener("click", e => { const li = e.target.closest("li"); if (li) choose(+li.dataset.i); });
$("palette").addEventListener("mousedown", e => { if (e.target.id === "palette") closePalette(); });

// ---------- modal ----------
let modalActs = {};
function modal(html, acts = {}) { $("modalBody").innerHTML = html; modalActs = acts; $("modal").classList.add("open"); }
function closeModal() { $("modal").classList.remove("open"); }
$("modal").addEventListener("click", e => {
  const a = e.target.closest("[data-act]")?.dataset.act;
  if (e.target.id === "modal" || a === "cancel") closeModal();
  else if (a && modalActs[a]) modalActs[a]();
});

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// ---------- images: paste or drop ----------
async function insertImages(files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return false;
  if (!post.file) { await save(); if (!post.file) { toast("Add a title before adding images"); return true; } }
  for (const f of imgs) {
    setStatus("Uploading image…");
    const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(f); });
    const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg").replace("svg+xml", "svg");
    try { const r = await api("/api/image", { file: post.file, ext, data }); insertAtCursor(`![](${r.url})\n`); }
    catch (e) { toast(e.message, 4000); }
  }
  return true;
}
function insertAtCursor(text) {
  els.body.focus();
  document.execCommand("insertText", false, text); // keeps native undo
  grow(); changed();
}
els.body.addEventListener("paste", async e => { if (e.clipboardData.files.length) { e.preventDefault(); await insertImages(e.clipboardData.files); } });
els.body.addEventListener("drop", async e => { if (e.dataTransfer.files.length) { e.preventDefault(); await insertImages(e.dataTransfer.files); } });

// ---------- editing niceties ----------
els.title.addEventListener("input", changed);
els.date.addEventListener("change", changed);
els.body.addEventListener("input", () => { grow(); changed(); });
els.title.addEventListener("keydown", e => { if (e.key === "Enter" || (e.key === "ArrowDown")) { e.preventDefault(); els.body.focus(); els.body.setSelectionRange(0, 0); } });
els.body.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.metaKey) { e.preventDefault(); document.execCommand("insertText", false, "  "); return; }
  if (e.key === "Enter" && !e.shiftKey && !e.metaKey) {
    // continue markdown lists
    const v = els.body.value, s = els.body.selectionStart;
    const line = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
    const m = line.match(/^(\s*)([-*+]|\d+\.)\s+(\[[ x]\]\s+)?/);
    if (!m) return;
    e.preventDefault();
    if (line.trim() === m[0].trim()) { // empty item: end the list
      els.body.setSelectionRange(s - line.length, s); document.execCommand("insertText", false, "\n");
      return;
    }
    const n = /\d/.test(m[2]) ? `${parseInt(m[2]) + 1}.` : m[2];
    document.execCommand("insertText", false, `\n${m[1]}${n} ${m[3] ? "[ ] " : ""}`);
  }
});

// ---------- shortcuts ----------
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  const pal = $("palette").classList.contains("open"), mod2 = $("modal").classList.contains("open");
  if (mod2) {
    if (e.key === "Escape") { e.preventDefault(); closeModal(); }
    if (e.key === "Enter" && modalActs.go) { e.preventDefault(); modalActs.go(); }
    return;
  }
  if (pal) {
    const n = filtered().length;
    if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % n; drawList(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + n) % n; drawList(); }
    else if (e.key === "Enter") { e.preventDefault(); choose(sel); }
    if (!(mod && e.key.toLowerCase() === "o")) return;
  }
  if (!mod) { if (e.key === "Escape" && document.body.classList.contains("previewing")) togglePreview(); return; }
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); save().then(ok => ok && toast("Saved", 900)); }
  else if (k === "o") { e.preventDefault(); pal ? closePalette() : openPalette(); }
  else if (k === "n") { e.preventDefault(); save().then(newPost); }
  else if (k === "/") { e.preventDefault(); togglePreview(); }
  else if (k === "enter") { e.preventDefault(); confirmPublish(); }
});

$("open").onclick = openPalette;
$("new").onclick = () => save().then(newPost);
$("toggle").onclick = togglePreview;
$("publish").onclick = confirmPublish;
window.addEventListener("resize", grow);
window.addEventListener("beforeunload", e => { if (snapshot() !== lastSaved && post.file) { save(); e.preventDefault(); } });

// ---------- start ----------
const last = store.get("lastFile");
last ? openFile(last) : newPost();
</script>
</body>
</html>
